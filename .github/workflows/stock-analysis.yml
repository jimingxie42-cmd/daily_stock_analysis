name: 股票分析推送

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    # 开盘前 (9:25 BJT) — 集合竞价出结果
    - cron: '25 1 * * 1-5'
    # 早盘观察 (9:55 BJT) — 开盘后走势
    - cron: '55 1 * * 1-5'
    # 午盘收官 (11:00 BJT) — 上午收盘前
    - cron: '0 3 * * 1-5'
    # 午后观察 (13:30 BJT) — 午后开盘走势
    - cron: '30 5 * * 1-5'
    # 尾盘判断 (14:30 BJT) — 收盘前30分钟
    - cron: '30 6 * * 1-5'
  repository_dispatch:
    types: [trigger]

jobs:
  push:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.10"

      - name: 安装依赖
        run: pip install -r requirements.txt

      - name: 🤖 AI 分析推送（主推）
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_BASE_URL: ${{ secrets.OPENAI_BASE_URL }}
          LITELLM_MODEL: openai/deepseek-v4-pro
          TAVILY_API_KEYS: ${{ secrets.TAVILY_API_KEYS }}
          PUSHPLUS_TOKEN: ${{ secrets.PUSHPLUS_TOKEN }}
          SERVERCHAN3_SENDKEY: ${{ secrets.SERVERCHAN3_SENDKEY }}
        run: python analyze.py

      - name: 📊 快照保底推送（上一步失败时）
        if: failure()
        env:
          PUSHPLUS_TOKEN: ${{ secrets.PUSHPLUS_TOKEN }}
          SERVERCHAN3_SENDKEY: ${{ secrets.SERVERCHAN3_SENDKEY }}
        run: python push_holdings.py
